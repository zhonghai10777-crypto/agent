appId: com.zhonghai10777.agent
productName: Agent
copyright: Copyright 2026 zhonghai10777-crypto
electronVersion: 44.3.0

directories:
  output: release
  buildResources: resources

files:
  - out/**/*
  - package.json
  # lazystream (used by exceljs) imports the legacy subpath
  # readable-stream/passthrough. pnpm hoisting exposes a newer top-level
  # readable-stream, so preserve lazystream's nested 2.x dependency in the
  # packaged app as well.
  - from: ../../node_modules/lazystream/node_modules/readable-stream
    to: node_modules/lazystream/node_modules/readable-stream
    filter:
      - '**/*'

extraResources:
  - from: resources/icon.png
    to: icon.png

asar: true
asarUnpack:
  - "**/*.node"
  - "**/*.wasm"
  - "**/node_modules/node-pty/**/*"
  - "**/node_modules/.pnpm/node-pty*/node_modules/node-pty/**/*"

artifactName: ${productName}-${version}-${arch}.${ext}

mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.inherit.plist
  notarize: true
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  darkModeSupport: true
  extraFiles:
    - from: build/native/pi-gui-notification-status-helper
      to: MacOS/pi-gui-notification-status-helper

linux:
  category: Development
  executableName: pi-gui
  maintainer: Matthew Lam <minghinmatthew.lam@gmail.com>
  vendor: Agent
  synopsis: Codex-style desktop app for the pi coding agent
  description: A native desktop interface for pi coding agent sessions, workspaces, and tools.
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64

deb:
  artifactName: ${productName}_${version}_${arch}.${ext}
  packageName: pi-gui
  packageCategory: devel
  priority: optional
  afterRemove: resources/linux/after-remove.sh
  depends:
    - libgtk-3-0 | libgtk-3-0t64
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0 | libatspi2.0-0t64
    - libuuid1
    - libsecret-1-0
    - libgbm1

win:
  executableName: agent
  signAndEditExecutable: true
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  artifactName: ${productName}-${version}-${arch}-setup.${ext}

portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}

toolsets:
  appimage: "1.0.2"

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

publish:
  provider: github
  owner: zhonghai10777-crypto
  repo: agent
