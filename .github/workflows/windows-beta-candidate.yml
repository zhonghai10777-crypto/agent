# Place this file at .github/workflows/windows-beta-candidate.yml.
# Generates Windows x64 candidate artifacts only. It does NOT publish a Release,
# require a publishing token, or replace full Windows UI / installer acceptance.
name: Windows Beta Candidate

on:
  workflow_dispatch:
    inputs:
      update_repository:
        description: 'Existing update repository (owner/repo). Empty uses the app default.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: windows-beta-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      # This embeds only a repository name. Never embed PI_APP_UPDATE_TOKEN.
      PI_APP_UPDATE_REPOSITORY: ${{ inputs.update_repository }}

    steps:
      - name: Check out the selected branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install the pnpm version pinned by the repository
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Validate configuration and product versions
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = ([string]$env:PI_APP_UPDATE_REPOSITORY).Trim()
          if ($repo) {
            if ($repo -notmatch '^[A-Za-z0-9-]+/[A-Za-z0-9_.-]+$' -or
                ($repo.Split('/')[1] -in @('.', '..'))) {
              throw 'update_repository must be an existing owner/repository name.'
            }
          }
          $root = Get-Content package.json -Raw | ConvertFrom-Json
          $desktop = Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json
          if ($root.version -ne $desktop.version) {
            throw 'Root and desktop product versions do not match.'
          }
          if ($desktop.version -notmatch '^\d+\.\d+\.\d+-beta\.[0-9]+$') {
            throw 'This candidate workflow expects a version such as 0.1.0-beta.33.'
          }
          Write-Host "Building candidate $($desktop.version) from $env:GITHUB_SHA"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # pi resolves PowerShell with spawnSync("where", ...) under a hard-coded 5s
      # timeout. On a hosted runner the first spawn of where.exe pays for loading
      # it and for Defender scanning it, which overruns that budget and fails the
      # test as "No PowerShell executable found" — while later lookups, served
      # from cache, return in milliseconds. Pay that cost here instead.
      #
      # Invoked as plain PowerShell rather than through `node -e`: this step runs
      # under pwsh, where a backtick is the escape character, so a JS template
      # literal in an inline script gets mangled before node ever sees it.
      - name: Warm up Windows executable lookup
        run: |
          where.exe pwsh.exe
          where.exe powershell.exe

      - name: Driver tests on Windows
        run: pnpm --filter @pi-gui/pi-sdk-driver test

      - name: Launcher contract
        run: pnpm --dir apps/desktop run verify:launcher-contract

      - name: Changed-file adapter tests
        run: pnpm --filter @pi-gui/desktop run test:changed-files

      # Full UI tests and clean-account install/upgrade/uninstall acceptance
      # must be completed separately before approving a public beta.
      - name: Build NSIS installer and portable executable
        id: build_installer
        run: pnpm package:win

      - name: Verify permissions, Windows junctions and credential recovery
        run: |
          New-Item -ItemType Directory -Force windows-candidate-results | Out-Null
          pnpm exec playwright test -c apps/desktop/playwright.config.ts apps/desktop/tests/unit/permission.spec.ts apps/desktop/tests/unit/orchestration-permission.spec.ts apps/desktop/tests/unit/document-access.spec.ts apps/desktop/tests/unit/secure-auth-recovery.spec.ts --output=windows-candidate-results/boundaries 2>&1 | Tee-Object -FilePath windows-candidate-results/boundaries.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify packaged dependencies
        run: pnpm --dir apps/desktop run verify:packaged-runtime-deps:windows

      - name: Record the actual packaged Electron runtime
        run: |
          node apps/desktop/scripts/inspect-electron-runtime.mjs --executable apps/desktop/release/win-unpacked/agent.exe --output apps/desktop/release/electron-runtime.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # These launch win-unpacked/agent.exe with synthetic local fixtures. They
      # do not launch the NSIS installer or portable wrapper or call real APIs.
      - name: Verify packaged documents, vision and native terminal
        env:
          PI_APP_TEST_MODE: background
          PI_APP_TEST_PACKAGED_DOCUMENTS: '1'
          PI_APP_TEST_PACKAGED_NATIVE_VISION: '1'
          PI_APP_TEST_PACKAGED_VISION: '1'
        run: |
          New-Item -ItemType Directory -Force windows-candidate-results | Out-Null
          pnpm exec playwright test -c apps/desktop/playwright.config.ts apps/desktop/tests/production/document-packaged.spec.ts apps/desktop/tests/production/vision-native-packaged.spec.ts apps/desktop/tests/production/vision-routing-packaged.spec.ts apps/desktop/tests/production/packaged-terminal.spec.ts --output=windows-candidate-results/packaged 2>&1 | Tee-Object -FilePath windows-candidate-results/packaged.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record build identity, signatures and SHA-256 checksums
        run: |
          $ErrorActionPreference = 'Stop'
          $desktop = Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json
          $version = $desktop.version
          $releaseDir = Join-Path $PWD 'apps/desktop/release'
          $runtime = Get-Content (Join-Path $releaseDir 'electron-runtime.json') -Raw | ConvertFrom-Json
          $names = @(
            "Agent-$version-x64-setup.exe",
            "Agent-$version-x64-portable.exe"
          )
          $checksums = @()
          $artifacts = @()
          foreach ($name in $names) {
            $file = Join-Path $releaseDir $name
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Expected artifact is missing: $file"
            }
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            $checksums += "$hash  $name"
            $artifacts += [ordered]@{
              file = $name
              sha256 = $hash
              bytes = (Get-Item -LiteralPath $file).Length
              signatureStatus = $signature.Status.ToString()
            }
          }
          $checksums | Set-Content (Join-Path $releaseDir 'SHA256SUMS.txt') -Encoding utf8
          [ordered]@{
            repository = $env:GITHUB_REPOSITORY
            commit = $env:GITHUB_SHA
            version = $version
            platform = 'win32'
            architecture = 'x64'
            electronVersion = $runtime.electronVersion
            nodeVersion = $runtime.nodeVersion
            chromeVersion = $runtime.chromeVersion
            osBuild = [Environment]::OSVersion.VersionString
            createdAtUtc = [DateTime]::UtcNow.ToString('o')
            updateRepositoryOverride = $env:PI_APP_UPDATE_REPOSITORY
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            acceptance = 'Candidate only: targeted unpacked EXE tests use local fixtures. NSIS, portable launcher, upgrade, real API and full Windows acceptance remain separate.'
            artifacts = $artifacts
          } | ConvertTo-Json -Depth 5 |
            Set-Content (Join-Path $releaseDir 'build-info.json') -Encoding utf8

      # Uploaded even when a verification step failed. The installer is produced
      # early, by "Build NSIS installer and portable executable"; gating its
      # upload on the checks that follow meant a failure in a packaged UI test
      # threw away a build that already exists on disk, and cost a full rerun to
      # get back. A candidate that failed verification is not fit to ship — the
      # verification log ships next to it — but it is still the artifact you
      # need in order to reproduce the failure locally.
      - name: Upload candidate files (not a GitHub Release)
        if: always() && steps.build_installer.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: windows-beta-candidate-${{ github.sha }}
          path: |
            apps/desktop/release/*-x64-setup.exe
            apps/desktop/release/*-x64-portable.exe
            apps/desktop/release/SHA256SUMS.txt
            apps/desktop/release/build-info.json
            apps/desktop/release/electron-runtime.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Save targeted verification logs and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-beta-verification-${{ github.sha }}
          path: |
            windows-candidate-results/
            apps/desktop/release/electron-runtime.json
          if-no-files-found: warn
          retention-days: 14
